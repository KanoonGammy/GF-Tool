name = "dresses-ai-studio"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# D1 Database for persistent project states, Garment DNA, DoD checks, and Cumulative Memory
[[d1_databases]]
binding = "DB"
database_name = "dresses_ai_db"
database_id = "your-d1-database-id-placeholder"

# R2 Bucket for dress cutouts, input photos, and generated videos
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "dresses-ai-assets"

[vars]
APP_NAME = "Fashion Dresses AI Studio"
DEFAULT_PASSCODE = "fashion2025" # รหัสผ่านเริ่มต้นสำหรับเพื่อน (ตั้งค่าใหม่ได้ใน Cloudflare Dashboard)
